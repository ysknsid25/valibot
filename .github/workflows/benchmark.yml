name: Benchmark

on:
  pull_request:
    branches: [vitest-bench]

permissions:
  contents: read

jobs:
  bench:
    name: Compare benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Fetch the full history so that both the base and head commits are available
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      # Runs the benchmarks on the base and head commits and comments the comparison
      - name: Compare benchmarks
        uses: ouka-lab/vitest-bench-compare@54b9cc02550dbee71b66e3ee1333736d131cb491 # v1.0.1
        with:
          dir: ${{ runner.temp }}/bench
          source: library/benchmarks
          install: pnpm install --frozen-lockfile
          run: pnpm exec vitest bench --run
          working-directory: library
